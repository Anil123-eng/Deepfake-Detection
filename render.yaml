# Render Blueprint configuration for Deepfake Detection
# See https://render.com/docs/blueprint-spec for details
services:
  - type: web
    name: deepfake-detection
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --timeout 300 --workers 1"
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        sync: false

